<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nouveau mot de passe | ASBL-LAS</title><link rel="stylesheet" href="./assets/site.css"></head>
<body class="auth-page">
<header class="site-header auth-header"><a class="brand" href="./index.html"><span class="brand-mark">LAS</span><span><strong>Les Amis de la Semence</strong><small>Réinitialisation sécurisée</small></span></a><a class="text-link" href="./login.html">← Connexion</a></header>
<main class="auth-wrap"><section class="auth-card"><p class="eyebrow">Sécurité du compte</p><h1>Nouveau mot de passe</h1><p class="muted">Choisissez un mot de passe long et unique, d’au moins 12 caractères.</p>
<form id="reset-form"><label for="new-password">Nouveau mot de passe</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required><label for="confirm-password">Confirmer le mot de passe</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required><button id="save-button" class="button button-full" type="submit">Enregistrer le mot de passe</button><p id="reset-message" class="form-message" role="status" aria-live="polite"></p></form>
<p class="fine-print">Le lien est à usage unique et expire après 30 minutes. Ne le partagez jamais.</p></section></main>
<script src="./assets/reset.js" defer></script>
</body></html>
