<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Connexion | ASBL-LAS</title><link rel="stylesheet" href="./assets/site.css"></head>
<body class="auth-page">
  <header class="site-header auth-header"><a class="brand" href="./index.html"><span class="brand-mark">LAS</span><span><strong>Les Amis de la Semence</strong><small>Espace membres sécurisé</small></span></a><a class="text-link" href="./index.html">← Retour au site</a></header>
  <main class="auth-wrap"><section class="auth-card"><p class="eyebrow">Espace privé</p><h1>Bienvenue</h1><p class="muted">Connectez-vous avec votre nom d'utilisateur et votre mot de passe.</p>
    <form id="login-form"><label for="username">Nom d'utilisateur</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="80"><label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><button class="button button-full" id="submit-button" type="submit">Se connecter</button><p id="login-message" class="form-message" role="status" aria-live="polite"></p></form>
    <button id="forgot-button" class="text-button" type="button">Mot de passe oublié ?</button><p class="fine-print">Ne partagez jamais votre mot de passe. L'accès aux informations est contrôlé par votre compte et vos autorisations.</p>
  </section></main>
  <script src="./assets/auth.js" defer></script>
</body></html>
