<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASBL LAS — Dashboard de Gestion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script>
        if (!sessionStorage.getItem('las_session_role')) {
            window.location.href = 'login.html';
        }
        
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { las: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 900: '#14532d' }, gold: { 400: '#facc15', 500: '#eab308' } }
                }
            }
        }
    </script>
    <style>
        .photo-preview { background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23cbd5e1"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>'); background-size: cover; background-position: center; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- Navbar -->
    <header class="bg-slate-900 text-white shadow-lg border-b border-las-700/40 sticky top-0 z-40 no-print">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-xl bg-white flex items-center justify-center text-green-600 text-2xl"><i class="fa-solid fa-seedling"></i></div>
                <div>
                    <h1 class="text-xl font-extrabold text-white flex items-center gap-2">ASBL LES AMIS DE LA SEMENCE <span class="text-gold-400 text-xs px-2 py-0.5 rounded-full bg-gold-500/20">LAS</span></h1>
                    <p class="text-xs text-slate-300 font-medium">Session: <span id="user-role-badge" class="uppercase text-green-400 font-bold"></span></p>
                </div>
            </div>
            <div class="flex items-center gap-2.5">
                <button onclick="openMemberModal()" id="btn-add" class="px-4 py-2 bg-las-700 hover:bg-las-600 font-bold rounded-xl text-xs transition flex items-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Nouveau Membre
                </button>
                <button onclick="logout()" class="px-4 py-2 bg-red-900 hover:bg-red-800 text-red-100 font-bold rounded-xl text-xs transition flex items-center gap-2">
                    <i class="fa-solid fa-power-off"></i> Déconnexion
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <!-- Statistiques -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 no-print">
            <div class="bg-white rounded-2xl p-4 border border-slate-200 flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center text-slate-700"><i class="fa-solid fa-users"></i></div>
                <div><div class="text-xl font-black" id="stat-total">0</div><div class="text-[10px] uppercase font-bold text-slate-500">Total Membres</div></div>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-slate-200 flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-green-50 flex items-center justify-center text-green-600"><i class="fa-solid fa-money-bill-wave"></i></div>
                <div><div class="text-xl font-black text-green-700" id="stat-finance">0 $</div><div class="text-[10px] uppercase font-bold text-slate-500">Caisse Mensuelle</div></div>
            </div>
        </div>

        <!-- Filtres -->
        <div class="bg-white rounded-2xl p-4 border border-slate-200 mb-6 flex flex-wrap gap-3 items-center justify-between no-print">
            <input type="text" id="search-input" placeholder="Rechercher..." class="w-full md:w-64 px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-green-500">
            <select id="filter-cotisation" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold">
                <option value="ALL">Toutes Cotisations</option>
                <option value="OK">En Règle (100%)</option>
                <option value="LITIGE">En Litige</option>
            </select>
            <div class="flex gap-1 bg-slate-100 p-1 rounded-xl">
                <button onclick="setView('table')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-white shadow-sm"><i class="fa-solid fa-table-list"></i> Table</button>
                <button onclick="setView('cards')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600"><i class="fa-solid fa-address-card"></i> Fiches</button>
            </div>
        </div>

        <!-- Vues -->
        <div id="view-table" class="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[800px]">
                <thead>
                    <tr class="bg-slate-900 text-slate-100 text-[11px] font-extrabold uppercase">
                        <th class="py-3 px-3 w-12 text-center">N°</th>
                        <th class="py-3 px-4 w-16">Photo</th>
                        <th class="py-3 px-4">Identité Complète</th>
                        <th class="py-3 px-4 text-center">Taux Cotisation (10$/m)</th>
                        <th class="py-3 px-3 text-center">Statut</th>
                        <th class="py-3 px-3 text-center no-print">Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-200 text-xs font-medium"></tbody>
            </table>
        </div>

        <div id="view-cards" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>

    <!-- Modal Formulaire -->
    <div id="member-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="bg-slate-900 px-6 py-4 flex justify-between text-white sticky top-0 z-10">
                <h3 class="font-bold"><i class="fa-solid fa-id-card text-gold-400 mr-2"></i> Fiche d'Identification</h3>
                <button onclick="closeMemberModal()"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="member-form" onsubmit="saveMember(event)" class="p-6">
                <input type="hidden" id="member-id">
                
                <div class="flex flex-col md:flex-row gap-6 mb-6">
                    <!-- Section Photo -->
                    <div class="flex flex-col items-center gap-2">
                        <div id="photo-preview" class="w-32 h-32 rounded-xl border-2 border-dashed border-slate-300 photo-preview overflow-hidden relative group">
                            <img id="img-render" src="" class="w-full h-full object-cover hidden">
                            <div class="absolute inset-0 bg-black/40 hidden group-hover:flex items-center justify-center cursor-pointer" onclick="document.getElementById('input-photo').click()">
                                <i class="fa-solid fa-camera text-white text-xl"></i>
                            </div>
                        </div>
                        <input type="file" id="input-photo" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
                        <button type="button" onclick="document.getElementById('input-photo').click()" class="text-[10px] font-bold text-slate-500 uppercase bg-slate-100 px-3 py-1 rounded-lg">Changer Photo</button>
                    </div>

                    <!-- Infos de base -->
                    <div class="flex-1 space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nom Complet</label>
                            <input type="text" id="input-name" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Téléphone</label>
                            <input type="text" id="input-phone" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Actif ASBL</label>
                                <select id="input-asbl" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                                    <option value="OUI">OUI</option>
                                    <option value="NON">NON</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Actif Forum</label>
                                <select id="input-forum" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                                    <option value="OUI">OUI</option>
                                    <option value="NON">NON</option>
                                    <option value="PARTIEL">PARTIEL</option>
                                    <option value="OCCASIONEL">OCCASIONEL</option>
                                    <option value="SOUVENT">SOUVENT</option>
                                    <option value="PARFOIS">PARFOIS</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section Financière -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6" id="section-finance">
                    <h4 class="text-xs font-extrabold text-slate-800 uppercase mb-3 flex items-center justify-between">
                        <span><i class="fa-solid fa-money-check-dollar text-green-600 mr-2"></i> Suivi des Cotisations (10$ / Mois)</span>
                        <span id="calc-total" class="bg-green-100 text-green-800 px-2 py-1 rounded-md">0 $ Total</span>
                    </h4>
                    <div class="grid grid-cols-4 sm:grid-cols-6 gap-2" id="months-grid">
                        <!-- Généré par JS -->
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeMemberModal()" class="px-5 py-2.5 bg-slate-200 text-slate-700 text-xs font-bold rounded-xl">Annuler</button>
                    <button type="submit" class="px-5 py-2.5 bg-green-700 text-white text-xs font-bold rounded-xl shadow-md">Enregistrer la Fiche</button>
                </div>
            </form>
        </div>
    </div>

        // Initialisation
        function initApp() {
            const role = sessionStorage.getItem('las_session_role');
            document.getElementById('user-role-badge').innerText = role;

            // Gestion des droits (RBAC)
            if (role === 'secretaire') document.getElementById('section-finance').style.opacity = '0.5';
            
            // Changement de la clé pour forcer le chargement des 36 membres
            const stored = localStorage.getItem('las_members_db_v2');
            if (stored) {
                membersData = JSON.parse(stored);
            } else {
                membersData = defaultMembers;
                saveData();
            }

            renderMonthsGrid();
            renderData();
        }

        function saveData() {
            localStorage.setItem('las_members_db_v2', JSON.stringify(membersData));
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }

        function handlePhotoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                currentPhotoB64 = event.target.result;
                document.getElementById('img-render').src = currentPhotoB64;
                document.getElementById('img-render').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function renderMonthsGrid() {
            const grid = document.getElementById('months-grid');
            grid.innerHTML = MONTHS.map((m, i) => `
                <label class="flex flex-col items-center p-2 border rounded-lg cursor-pointer hover:bg-slate-50 transition month-label">
                    <span class="text-[10px] font-bold text-slate-500 mb-1">${m}</span>
                    <input type="checkbox" id="month-${i}" class="w-4 h-4 text-green-600 rounded" onchange="updateLiveTotal()">
                </label>
            `).join('');
        }

        function updateLiveTotal() {
            let count = 0;
            for(let i=0; i<12; i++) {
                if(document.getElementById(`month-${i}`).checked) count++;
            }
            document.getElementById('calc-total').innerText = `${count * 10} $ Total`;
        }

        function openMemberModal(memberId = null) {
            const form = document.getElementById('member-form');
            form.reset();
            currentPhotoB64 = "";
            document.getElementById('img-render').src = "";
            document.getElementById('img-render').classList.add('hidden');
            document.getElementById('calc-total').innerText = "0 $ Total";
            
            for(let i=0; i<12; i++) document.getElementById(`month-${i}`).checked = false;

            if (memberId) {
                const member = membersData.find(m => m.id === memberId);
                document.getElementById('member-id').value = member.id;
                document.getElementById('input-name').value = member.name;
                document.getElementById('input-phone').value = member.phone;
                document.getElementById('input-asbl').value = member.asbl;
                document.getElementById('input-forum').value = member.forum;
                
                if (member.photo) {
                    currentPhotoB64 = member.photo;
                    document.getElementById('img-render').src = member.photo;
                    document.getElementById('img-render').classList.remove('hidden');
                }

                member.cotisations.forEach((paid, i) => {
                    document.getElementById(`month-${i}`).checked = paid;
                });
                updateLiveTotal();
            } else {
                document.getElementById('member-id').value = '';
            }

            document.getElementById('member-modal').classList.remove('hidden');
        }

        function closeMemberModal() {
            document.getElementById('member-modal').classList.add('hidden');
        }

        function saveMember(e) {
            e.preventDefault();
            const role = sessionStorage.getItem('las_session_role');
            
            const idVal = document.getElementById('member-id').value;
            const newMember = {
                id: idVal ? parseInt(idVal) : Date.now(),
                name: document.getElementById('input-name').value,
                phone: document.getElementById('input-phone').value,
                asbl: document.getElementById('input-asbl').value,
                forum: document.getElementById('input-forum').value,
                photo: currentPhotoB64,
                cotisations: Array.from({length: 12}, (_, i) => document.getElementById(`month-${i}`).checked)
            };

            if (idVal) {
                const index = membersData.findIndex(m => m.id === parseInt(idVal));
                if (role === 'secretaire') {
                    newMember.cotisations = membersData[index].cotisations; // Bloque édition finances
                }
                membersData[index] = newMember;
            } else {
                membersData.push(newMember);
            }

            saveData();
            renderData();
            closeMemberModal();
        }

        function getCotisationStats(cots) {
            const paid = cots.filter(Boolean).length;
            const totalStr = `${paid * 10}$`;
            const percentage = Math.round((paid / 12) * 100);
            const statusBadge = percentage === 100 
                ? `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded-full text-[10px] font-bold">À JOUR</span>` 
                : `<span class="bg-red-100 text-red-800 px-2 py-0.5 rounded-full text-[10px] font-bold">LITIGE (${120 - (paid*10)}$)</span>`;
            return { totalStr, percentage, statusBadge, isLitige: percentage < 100 };
        }

        function deleteMember(id) {
            if(confirm('Supprimer ce membre définitivement ?')) {
                membersData = membersData.filter(m => m.id !== id);
                saveData();
                renderData();
            }
        }

        function renderData() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const filterCot = document.getElementById('filter-cotisation').value;

            let totalCaisse = 0;
            const filtered = membersData.filter(m => {
                const stats = getCotisationStats(m.cotisations);
                totalCaisse += (m.cotisations.filter(Boolean).length * 10);
                
                const matchSearch = m.name.toLowerCase().includes(search) || m.phone.includes(search);
                const matchCot = filterCot === 'ALL' || (filterCot === 'OK' && !stats.isLitige) || (filterCot === 'LITIGE' && stats.isLitige);
                return matchSearch && matchCot;
            });

            document.getElementById('stat-total').innerText = membersData.length;
            document.getElementById('stat-finance').innerText = `${totalCaisse} $`;

            // Rendu Table
            document.getElementById('table-body').innerHTML = filtered.map(m => {
                const stats = getCotisationStats(m.cotisations);
                const photoSrc = m.photo ? `<img src="${m.photo}" class="w-8 h-8 rounded-full object-cover">` : `<div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-400"><i class="fa-solid fa-user text-xs"></i></div>`;
                return `
                <tr class="hover:bg-slate-50 border-b">
                    <td class="py-2 px-3 font-mono text-xs text-slate-400 text-center">${m.id}</td>
                    <td class="py-2 px-4">${photoSrc}</td>
                    <td class="py-2 px-4"><div class="font-bold text-slate-900">${m.name}</div><div class="text-[10px] text-slate-500 font-mono">${m.phone}</div></td>
                    <td class="py-2 px-4 text-center">
                        <div class="w-full bg-slate-200 rounded-full h-1.5 mb-1"><div class="bg-green-500 h-1.5 rounded-full" style="width: ${stats.percentage}%"></div></div>
                        <span class="text-[10px] font-bold text-slate-600">${stats.totalStr} / 120$</span>
                    </td>
                    <td class="py-2 px-3 text-center">${stats.statusBadge}</td>
                    <td class="py-2 px-3 text-center no-print">
                        <button onclick="openMemberModal(${m.id})" class="text-blue-600 hover:text-blue-800 p-1"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteMember(${m.id})" class="text-red-500 hover:text-red-700 p-1 ml-1"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');

            // Rendu Cards
            document.getElementById('view-cards').innerHTML = filtered.map(m => {
                const stats = getCotisationStats(m.cotisations);
                const photoSrc = m.photo ? `<img src="${m.photo}" class="w-16 h-16 rounded-xl object-cover shadow-sm">` : `<div class="w-16 h-16 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-300 text-2xl"><i class="fa-solid fa-user"></i></div>`;
                return `
                <div class="bg-white rounded-2xl p-4 border border-slate-200 flex flex-col gap-3">
                    <div class="flex gap-3 items-start">
                        ${photoSrc}
                        <div class="flex-1">
                            <h3 class="font-bold text-sm leading-tight text-slate-900">${m.name}</h3>
                            <p class="text-[11px] font-mono text-slate-500 mt-0.5">${m.phone}</p>
                            <div class="mt-1">${stats.statusBadge}</div>
                        </div>
                    </div>
                    <div class="bg-slate-50 rounded-lg p-2 text-[10px] font-bold flex justify-between border border-slate-100">
                        <span class="text-slate-500">Total Versé:</span>
                        <span class="text-green-700 text-xs">${stats.totalStr}</span>
                    </div>
                    <button onclick="openMemberModal(${m.id})" class="w-full py-1.5 text-xs font-bold bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-700 transition"><i class="fa-solid fa-eye"></i> Ouvrir la Fiche</button>
                </div>`;
            }).join('');
        }

        function setView(view) {
            if(view === 'table') {
                document.getElementById('view-table').classList.remove('hidden');
                document.getElementById('view-cards').classList.add('hidden');
            } else {
                document.getElementById('view-table').classList.add('hidden');
                document.getElementById('view-cards').classList.remove('hidden');
                document.getElementById('view-cards').classList.add('grid');
            }
        }

        document.getElementById('search-input').addEventListener('input', renderData);
        document.getElementById('filter-cotisation').addEventListener('change', renderData);

        window.onload = initApp;
    </script>
</body>
</html>
