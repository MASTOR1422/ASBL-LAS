            window.location.href = 'login.html';
        }

        function handlePhotoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                currentPhotoB64 = event.target.result;
                document.getElementById('img-render').src = currentPhotoB64;
                document.getElementById('img-render').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function renderMonthsGrid() {
            const grid = document.getElementById('months-grid');
            grid.innerHTML = MONTHS.map((m, i) => `
                <label class="flex flex-col items-center p-2 bg-white border rounded-lg cursor-pointer hover:bg-slate-50 transition">
                    <span class="text-[10px] font-bold text-slate-500 mb-1">${m}</span>
                    <input type="checkbox" id="month-${i}" class="w-4 h-4 text-green-600 rounded" onchange="updateLiveTotal()">
                </label>
            `).join('');
        }

        function updateLiveTotal() {
            let count = 0;
            for(let i=0; i<12; i++) {
                if(document.getElementById(`month-${i}`).checked) count++;
            }
            document.getElementById('calc-total').innerText = `${count * 10} $ Total`;
        }

        function openMemberModal(memberId = null) {
            document.getElementById('member-form').reset();
            currentPhotoB64 = "";
            document.getElementById('img-render').src = "";
            document.getElementById('img-render').classList.add('hidden');
            document.getElementById('calc-total').innerText = "0 $ Total";
            for(let i=0; i<12; i++) document.getElementById(`month-${i}`).checked = false;

            if (memberId) {
                const member = membersData.find(m => m.id === memberId);
                document.getElementById('member-id').value = member.id;
                document.getElementById('input-name').value = member.name;
                document.getElementById('input-phone').value = member.phone;
                document.getElementById('input-asbl').value = member.asbl;
                document.getElementById('input-forum').value = member.forum;
                
                if (member.photo) {
                    currentPhotoB64 = member.photo;
                    document.getElementById('img-render').src = member.photo;
                    document.getElementById('img-render').classList.remove('hidden');
                }

                if(member.cotisations) {
                    member.cotisations.forEach((paid, i) => {
                        document.getElementById(`month-${i}`).checked = paid;
                    });
                }
                updateLiveTotal();
            } else {
                document.getElementById('member-id').value = '';
            }

            document.getElementById('member-modal').classList.remove('hidden');
        }

        function closeMemberModal() {
            document.getElementById('member-modal').classList.add('hidden');
        }

        function saveMember(e) {
            e.preventDefault();
            const role = sessionStorage.getItem('las_session_role');
            const idVal = document.getElementById('member-id').value;
            
            const newMember = {
                id: idVal ? parseInt(idVal) : (membersData.length > 0 ? Math.max(...membersData.map(m => m.id)) + 1 : 1),
                name: document.getElementById('input-name').value.trim(),
                phone: document.getElementById('input-phone').value.trim(),
                asbl: document.getElementById('input-asbl').value,
                forum: document.getElementById('input-forum').value,
                photo: currentPhotoB64,
                cotisations: Array.from({length: 12}, (_, i) => document.getElementById(`month-${i}`).checked)
            };

            if (idVal) {
                const index = membersData.findIndex(m => m.id === parseInt(idVal));
                if (role === 'secretaire') {
                    newMember.cotisations = membersData[index].cotisations; // Bloque modif financière pour le secrétaire
                }
                membersData[index] = newMember;
            } else {
                membersData.unshift(newMember);
            }

            saveData();
            renderData();
            closeMemberModal();
        }

        function getCotisationStats(cots) {
            const paid = (cots || Array(12).fill(false)).filter(Boolean).length;
            const totalStr = `${paid * 10}$`;
            const percentage = Math.round((paid / 12) * 100);
            const statusBadge = percentage === 100 
                ? `<span class="bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full text-[10px] font-bold border border-emerald-300">EN RÈGLE</span>` 
                : `<span class="bg-rose-100 text-rose-800 px-2.5 py-0.5 rounded-full text-[10px] font-bold border border-rose-300">LITIGE (${120 - (paid*10)}$)</span>`;
            return { totalStr, percentage, statusBadge, isLitige: percentage < 100 };
        }

        function deleteMember(id) {
            if(confirm('Êtes-vous sûr de vouloir supprimer ce membre ?')) {
                membersData = membersData.filter(m => m.id !== id);
                saveData();
                renderData();
            }
        }

        function getBadge(val, type) {
            const v = (val || '').toUpperCase();
            if (v === 'OUI') return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">OUI</span>`;
            if (v === 'NON') return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800 border border-rose-300">NON</span>`;
            return `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-100 text-amber-900 border border-amber-300">${v}</span>`;
        }

        function renderData() {
            const search = document.getElementById('search-input').value.toLowerCase().trim();
            const filterAsbl = document.getElementById('filter-asbl').value;
            const filterCot = document.getElementById('filter-cotisation').value;

            let totalCaisse = 0;
            const filtered = membersData.filter(m => {
                const stats = getCotisationStats(m.cotisations);
                totalCaisse += (m.cotisations || Array(12).fill(false)).filter(Boolean).length * 10;
                
                const matchSearch = m.name.toLowerCase().includes(search) || m.phone.toLowerCase().includes(search);
                const matchAsbl = filterAsbl === 'ALL' || m.asbl === filterAsbl;
                const matchCot = filterCot === 'ALL' || (filterCot === 'OK' && !stats.isLitige) || (filterCot === 'LITIGE' && stats.isLitige);
                return matchSearch && matchAsbl && matchCot;
            });

            document.getElementById('stat-total').innerText = membersData.length;
            document.getElementById('stat-actifs').innerText = membersData.filter(m => m.asbl === 'OUI').length;
            document.getElementById('stat-finance').innerText = `${totalCaisse} $`;
            document.getElementById('stat-litige').innerText = membersData.filter(m => getCotisationStats(m.cotisations).isLitige).length;

            // Rendu Table
            document.getElementById('table-body').innerHTML = filtered.map(m => {
                const stats = getCotisationStats(m.cotisations);
                const photoSrc = m.photo ? `<img src="${m.photo}" class="w-9 h-9 rounded-full object-cover shadow-sm">` : `<div class="w-9 h-9 rounded-full bg-slate-200 flex items-center justify-center text-slate-400"><i class="fa-solid fa-user text-xs"></i></div>`;
                return `
                <tr class="hover:bg-slate-50 transition">
                    <td class="py-2.5 px-3 font-mono text-xs text-slate-400 text-center">${m.id}</td>
                    <td class="py-2.5 px-4">${photoSrc}</td>
                    <td class="py-2.5 px-4 font-bold text-slate-900">${m.name}</td>
                    <td class="py-2.5 px-4 font-mono text-slate-700 text-xs">${m.phone}</td>
                    <td class="py-2.5 px-3 text-center">${getBadge(m.forum, 'forum')}</td>
                    <td class="py-2.5 px-3 text-center">${getBadge(m.asbl, 'asbl')}</td>
                    <td class="py-2.5 px-4 text-center">
                        <div class="w-full bg-slate-200 rounded-full h-1.5 mb-1"><div class="bg-emerald-500 h-1.5 rounded-full" style="width: ${stats.percentage}%"></div></div>
                        <span class="text-[10px] font-bold text-slate-600">${stats.totalStr} / 120$</span>
                    </td>
                    <td class="py-2.5 px-3 text-center">${stats.statusBadge}</td>
                    <td class="py-2.5 px-3 text-center no-print">
                        <button onclick="openMemberModal(${m.id})" class="p-1.5 text-slate-500 hover:text-las-700 hover:bg-slate-100 rounded-lg transition" title="Modifier"><i class="fa-solid fa-pen-to-square text-xs"></i></button>
                        <button onclick="deleteMember(${m.id})" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" title="Supprimer"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </td>
                </tr>`;
            }).join('');

            // Rendu Cards
            document.getElementById('view-cards').innerHTML = filtered.map(m => {
                const stats = getCotisationStats(m.cotisations);
                const photoSrc = m.photo ? `<img src="${m.photo}" class="w-16 h-16 rounded-xl object-cover shadow-sm">` : `<div class="w-16 h-16 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-300 text-2xl"><i class="fa-solid fa-user"></i></div>`;
                return `
                <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex flex-col justify-between space-y-3">
                    <div class="flex gap-3 items-start border-b border-slate-100 pb-3">
                        ${photoSrc}
                        <div class="flex-1">
                            <span class="text-[10px] font-mono text-las-700 font-bold">N° ${m.id}</span>
                            <h3 class="font-bold text-slate-900 text-sm leading-tight">${m.name}</h3>
                            <p class="text-[11px] font-mono text-slate-500 mt-0.5">${m.phone}</p>
                        </div>
                    </div>
                    <div class="space-y-1.5 text-xs">
                        <div class="flex justify-between"><span>ASBL:</span> <span>${getBadge(m.asbl, 'asbl')}</span></div>
                        <div class="flex justify-between"><span>Statut:</span> <span>${stats.statusBadge}</span></div>
                    </div>
                    <button onclick="openMemberModal(${m.id})" class="w-full py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition">
                        <i class="fa-solid fa-eye mr-1"></i> Ouvrir la Fiche
                    </button>
                </div>`;
            }).join('');
        }

        function setView(view) {
            currentView = view;
            const t = document.getElementById('view-table');
            const c = document.getElementById('view-cards');
            const bt = document.getElementById('btn-view-table');
            const bc = document.getElementById('btn-view-cards');

            if (view === 'table') {
                t.classList.remove('hidden');
                c.classList.add('hidden');
                bt.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-white text-slate-900 shadow-sm";
                bc.className = "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5";
            } else {
                t.classList.add('hidden');
                c.classList.remove('hidden');
                c.classList.add('grid');
                bc.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-white text-slate-900 shadow-sm";
                bt.className = "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5";
            }
        }

        function exportCSV() {
            const headers = ["N°", "Nom & Prénom", "Téléphone", "Actif Forum", "Actif ASBL", "Cotisation Totale"];
            const rows = membersData.map(m => [
                m.id,
                `"${m.name.replace(/"/g, '""')}"`,
                `"${m.phone}"`,
                `"${m.forum}"`,
                `"${m.asbl}"`,
                `"${(m.cotisations || []).filter(Boolean).length * 10}$"`
            ]);
            const csv = "\uFEFF" + [headers.join(";"), ...rows.map(r => r.join(";"))].join("\n");
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `ASBL_LAS_Membres_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        document.getElementById('search-input').addEventListener('input', renderData);
        document.getElementById('filter-asbl').addEventListener('change', renderData);
        document.getElementById('filter-cotisation').addEventListener('change', renderData);

        window.onload = initApp;
    </script>
</body>
</html>
