<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le mot de passe — ASBL LAS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
</head>
<body class="min-h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-green-950">
<main class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-5">
  <h1 class="text-xl font-extrabold text-slate-900">Nouveau mot de passe</h1>
  <p class="text-sm text-slate-600">Choisissez un nouveau mot de passe d’au moins 12 caractères.</p>
  <div id="message" role="status" aria-live="polite" class="text-sm text-slate-700">Vérification du lien de sécurité…</div>
  <form id="reset-form" class="hidden space-y-4">
    <label class="block text-sm font-semibold text-slate-700">Nouveau mot de passe
      <input id="new-password" type="password" autocomplete="new-password" minlength="12" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3">
    </label>
    <label class="block text-sm font-semibold text-slate-700">Confirmer le mot de passe
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3">
    </label>
    <button id="save-button" class="w-full rounded-xl bg-green-700 px-4 py-3 font-bold text-white disabled:opacity-50" type="submit">Enregistrer le mot de passe</button>
  </form>
  <a class="inline-block text-sm font-semibold text-green-800 hover:underline" href="/login.html">Retour à la connexion</a>
</main>
<script>
  const message = document.getElementById("message");
  const resetForm = document.getElementById("reset-form");
  const saveButton = document.getElementById("save-button");
  function setMessage(text, isError) {
    message.textContent = text;
    message.className = "text-sm " + (isError ? "text-rose-700" : "text-slate-700");
  }
  async function initialize() {
    if (new URLSearchParams(window.location.search).has("error_code") ||
        window.location.hash.includes("error=access_denied")) {
      setMessage("Ce lien est invalide ou expiré. Retournez à la connexion et demandez un nouveau lien.", true);
      return;
    }
    try {
      await window.LAS_SUPABASE_READY;
      const { data, error } = await window.lasSupabase.auth.getSession();
      if (error || !data?.session) {
        setMessage("Lien invalide ou expiré. Demandez un nouveau lien de récupération.", true);
        return;
      }
      resetForm.classList.remove("hidden");
      setMessage("Lien vérifié. Vous pouvez choisir un nouveau mot de passe.", false);
    } catch (_) {
      setMessage("Le service est indisponible. Réessayez ou demandez un nouveau lien.", true);
    }
  }
  resetForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const password = document.getElementById("new-password").value;
    const confirmation = document.getElementById("confirm-password").value;
    if (password.length < 12) return setMessage("Le mot de passe doit contenir au moins 12 caractères.", true);
    if (password !== confirmation) return setMessage("Les deux mots de passe ne correspondent pas.", true);
    saveButton.disabled = true;
    try {
      const { error } = await window.lasSupabase.auth.updateUser({ password });
      if (error) { setMessage("Modification impossible. Le lien a peut-être expiré ; demandez-en un nouveau.", true); return; }
      await window.lasSupabase.auth.signOut();
      resetForm.classList.add("hidden");
      setMessage("Mot de passe modifié. Vous pouvez maintenant vous connecter avec votre identifiant.", false);
    } catch (_) { setMessage("Service indisponible. Réessayez plus tard.", true); }
    finally { saveButton.disabled = false; }
  });
  initialize();
</script>
</body></html>
