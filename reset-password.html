<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe — ASBL LAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="Auth.js"></script>
</head>
<body class="min-h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-green-950 font-sans">
    <main class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        <header class="bg-slate-900 p-7 text-center">
            <h1 class="text-xl font-extrabold text-white">Créer un nouveau mot de passe</h1>
            <p class="text-slate-300 text-xs mt-2">ASBL LES AMIS DE LA SEMENCE</p>
        </header>
        <form id="new-password-form" class="p-8 space-y-5" onsubmit="handleNewPassword(event)">
            <p class="text-xs text-slate-600">Choisissez un mot de passe d’au moins 12 caractères. Après validation, vous pourrez vous reconnecter avec ce nouveau mot de passe.</p>
            <div id="status-msg" role="status" aria-live="polite" class="hidden text-xs font-bold p-3.5 rounded-xl text-center border"></div>
            <div>
                <label for="new-password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Nouveau mot de passe</label>
                <input id="new-password" type="password" autocomplete="new-password" minlength="12" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-green-500 focus:outline-none">
            </div>
            <div>
                <label for="confirm-password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Confirmer le mot de passe</label>
                <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-green-500 focus:outline-none">
            </div>
            <button id="save-button" type="submit" class="w-full py-3.5 bg-green-800 hover:bg-green-700 disabled:opacity-60 text-white font-extrabold rounded-xl shadow-lg transition text-xs uppercase tracking-wider">Enregistrer le nouveau mot de passe</button>
            <a href="login.html" class="block text-center text-xs font-bold text-slate-600 hover:text-slate-900 underline underline-offset-4">Retour à la connexion</a>
        </form>
    </main>
    <script>
        function showStatus(message, success) {
            const box = document.getElementById("status-msg");
            box.textContent = message;
            box.className = "text-xs font-bold p-3.5 rounded-xl text-center border " +
                (success ? "bg-emerald-50 text-emerald-700 border-emerald-200" : "bg-rose-50 text-rose-600 border-rose-200");
            box.classList.remove("hidden");
        }
        async function handleNewPassword(event) {
            event.preventDefault();
            const password = document.getElementById("new-password").value;
            const confirmation = document.getElementById("confirm-password").value;
            const button = document.getElementById("save-button");
            if (password !== confirmation) {
                showStatus("Les deux mots de passe ne correspondent pas.", false);
                return;
            }
            button.disabled = true;
            showStatus("Vérification du lien et enregistrement…", true);
            try {
                const result = await completePasswordReset(password);
                showStatus(result.message, result.success);
                if (result.success) {
                    document.getElementById("new-password-form").reset();
                    button.textContent = "Mot de passe enregistré";
                    window.setTimeout(() => window.location.replace("login.html"), 2200);
                }
            } catch (_) {
                showStatus("Une erreur est survenue. Le lien est peut-être expiré ; demandez-en un nouveau.", false);
            } finally {
                if (button.textContent !== "Mot de passe enregistré") button.disabled = false;
            }
        }
        document.addEventListener("DOMContentLoaded", async () => {
            try { await window.LAS_SUPABASE_READY; } catch (_) {}
            if (!lasIsConfigured()) {
                showStatus("Le service de réinitialisation n’est pas configuré. Contactez l’administrateur LAS.", false);
                document.getElementById("save-button").disabled = true;
            }
        });
    </script>
</body>
</html>
