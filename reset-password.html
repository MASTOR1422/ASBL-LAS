<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe — ASBL LAS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script><script src="supabase-client.js"></script>
</head>
<body class="min-h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-green-950 font-sans">
  <main class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
    <header class="bg-slate-900 p-8 text-center text-white">
      <div class="text-3xl text-yellow-400 mb-3"><i class="fa-solid fa-shield-halved"></i></div>
      <h1 class="text-xl font-extrabold">Créer un nouveau mot de passe</h1>
      <p class="text-slate-300 text-sm mt-2">ASBL Les Amis de la Semence</p>
    </header>
    <form id="reset-form" class="p-8 space-y-5">
      <p class="text-sm text-slate-600">Choisissez un mot de passe d’au moins 12 caractères et confirmez-le.</p>
      <div id="feedback" class="hidden rounded-xl p-3 text-sm" role="status" aria-live="polite"></div>
      <div>
        <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Nouveau mot de passe</label>
        <input id="password" type="password" autocomplete="new-password" minlength="12" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-green-600 focus:outline-none">
      </div>
      <div>
        <label for="confirm-password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Confirmer le mot de passe</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-green-600 focus:outline-none">
      </div>
      <button id="save-button" type="submit" class="w-full py-3.5 bg-green-800 hover:bg-green-700 text-white font-extrabold rounded-xl">Enregistrer le nouveau mot de passe</button>
      <p class="text-center"><a href="login.html" class="text-sm font-bold text-green-800 underline underline-offset-4">Retour à la connexion</a></p>
    </form>
  </main>
  <script>
    const form = document.getElementById("reset-form");
    const feedback = document.getElementById("feedback");
    const saveButton = document.getElementById("save-button");
    let recoveryReady = false;
    function showFeedback(message, success) {
      feedback.className = "rounded-xl p-3 text-sm " + (success ? "bg-green-50 text-green-800" : "bg-rose-50 text-rose-800");
      feedback.textContent = message;
      feedback.classList.remove("hidden");
    }
    async function initializeRecovery() {
      try {
        await window.LAS_SUPABASE_READY;
        const url = new URL(window.location.href);
        const authError = url.searchParams.get("error_description") || url.searchParams.get("error");
        if (authError) throw new Error("Le lien de récupération est invalide ou expiré. Demandez un nouveau lien.");
        const { data, error } = await window.lasSupabase.auth.getSession();
        if (error || !data?.session) throw new Error("Lien invalide ou expiré. Demandez un nouveau lien de récupération.");
        recoveryReady = true;
      } catch (error) {
        saveButton.disabled = true;
        showFeedback(error.message || "Impossible de vérifier le lien de récupération.", false);
      }
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!recoveryReady) return;
      const password = document.getElementById("password").value;
      const confirmation = document.getElementById("confirm-password").value;
      if (password.length < 12) return showFeedback("Le mot de passe doit contenir au moins 12 caractères.", false);
      if (password !== confirmation) return showFeedback("Les deux mots de passe ne correspondent pas.", false);
      saveButton.disabled = true;
      showFeedback("Mise à jour du mot de passe…", true);
      try {
        const { error } = await window.lasSupabase.auth.updateUser({ password });
        if (error) throw error;
        showFeedback("Mot de passe modifié avec succès. Vous allez être redirigé vers la connexion.", true);
        await window.lasSupabase.auth.signOut();
        setTimeout(() => window.location.replace("login.html"), 1800);
      } catch (error) {
        showFeedback(error.message || "La modification a échoué. Demandez un nouveau lien si nécessaire.", false);
        saveButton.disabled = false;
      }
    });
    initializeRecovery();
  </script>
</body>
</html>
