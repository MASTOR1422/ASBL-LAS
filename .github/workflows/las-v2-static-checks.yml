name: ASBL-LAS V2 SQLite checks
on:
  push:
    branches:
      - rewrite/asbl-las-v2
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  local-sqlite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install local server dependencies
        working-directory: local
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        working-directory: local
        run: npm run check
      - name: Test SQLite schema and audit
        working-directory: local
        run: npm test
      - name: Check V2 browser JavaScript
        run: |
          set -eu
          for file in v2/assets/site.js v2/assets/auth.js v2/assets/portal.js v2/assets/public-content.js; do
            test -f "$file"
            node --check "$file"
          done
      - name: Verify local pages and ensure no Supabase browser client
        run: |
          set -eu
          test -f v2/index.html
          test -f v2/login.html
          test -f v2/espace.html
          test -f v2/reset-password.html
          test -f local/sqlite/schema.sql
          test -f local/server.js
          ! grep -q 'supabase-config.js\|supabase-client.js\|supabase-js@' v2/index.html
          ! grep -q 'supabase-config.js\|supabase-client.js\|supabase-js@' v2/login.html
          ! grep -q 'supabase-config.js\|supabase-client.js\|supabase-js@' v2/espace.html
