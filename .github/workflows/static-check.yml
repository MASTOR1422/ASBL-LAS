name: Validate static LAS application

on:
  push:
    branches:
      - main
      - release/las-coherent
      - security/las-security-by-design
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node scripts/check-static.mjs
