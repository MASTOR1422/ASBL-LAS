<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Récupération du mot de passe — ASBL LAS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="Auth.js"></script>
</head>
<body class="min-h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-green-950 font-sans">
  <main class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
    <header class="bg-slate-900 p-8 text-center text-white">
      <div class="text-3xl text-yellow-400 mb-3"><i class="fa-solid fa-key"></i></div>
      <h1 class="text-xl font-extrabold">Mot de passe oublié ?</h1>
      <p class="text-slate-300 text-sm mt-2">ASBL Les Amis de la Semence</p>
    </header>
    <form id="recovery-form" class="p-8 space-y-5">
      <p class="text-sm text-slate-600">Indiquez l’adresse e-mail associée à votre compte. Nous vous enverrons un lien sécurisé pour choisir un nouveau mot de passe.</p>
      <div id="feedback" class="hidden rounded-xl p-3 text-sm" role="status" aria-live="polite"></div>
      <div>
        <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Adresse e-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="nom@exemple.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-green-600 focus:outline-none">
      </div>
      <button id="send-button" type="submit" class="w-full py-3.5 bg-green-800 hover:bg-green-700 text-white font-extrabold rounded-xl">Envoyer le lien de récupération</button>
      <p class="text-center"><a href="login.html" class="text-sm font-bold text-green-800 underline underline-offset-4">Retour à la connexion</a></p>
    </form>
  </main>
  <script>
    const form = document.getElementById("recovery-form");
    const feedback = document.getElementById("feedback");
    const sendButton = document.getElementById("send-button");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      feedback.className = "rounded-xl p-3 text-sm bg-blue-50 text-blue-800";
      feedback.textContent = "Envoi de la demande…";
      feedback.classList.remove("hidden");
      sendButton.disabled = true;
      try {
        const result = await requestPasswordReset(document.getElementById("email").value);
        feedback.className = "rounded-xl p-3 text-sm " + (result.success ? "bg-green-50 text-green-800" : "bg-rose-50 text-rose-800");
        feedback.textContent = result.message;
      } catch (_) {
        feedback.className = "rounded-xl p-3 text-sm bg-rose-50 text-rose-800";
        feedback.textContent = "Le service est momentanément indisponible. Réessayez plus tard.";
      } finally { sendButton.disabled = false; }
    });
  </script>
</body>
</html>
