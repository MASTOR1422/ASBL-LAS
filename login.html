<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — ASBL LES AMIS DE LA SEMENCE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="Auth.js"></script>
</head>
<body class="min-h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-green-950 font-sans">
  <main class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
    <header class="bg-slate-900 p-8 text-center border-b border-green-700/50">
      <div class="w-20 h-20 mx-auto bg-white rounded-2xl flex items-center justify-center shadow-lg mb-4 p-2">
        <img src="logo LAS_2.jpg" alt="Logo officiel ASBL LAS" class="w-full h-full object-contain" onerror="this.onerror=null;this.src='logo LAS.jpg'">
      </div>
      <h1 class="text-xl font-extrabold text-white tracking-tight">ASBL LES AMIS DE LA SEMENCE</h1>
      <p class="text-slate-400 text-xs mt-2">Portail sécurisé de gestion administrative</p>
    </header>
    <form id="login-form" class="p-8 space-y-5">
      <div id="message" role="status" aria-live="polite" class="hidden text-xs font-bold p-3.5 rounded-xl text-center border"></div>
      <div><label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Nom d’utilisateur</label>
        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="80" placeholder="Votre identifiant"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:ring-2 focus:ring-green-500 focus:outline-none"></div>
      <div><label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Mot de passe</label>
        <div class="relative"><input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Votre mot de passe"
          class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:ring-2 focus:ring-green-500 focus:outline-none">
          <button type="button" id="toggle-password" aria-label="Afficher ou masquer le mot de passe" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-solid fa-eye" id="eye-icon"></i></button></div></div>
      <button id="login-button" type="submit" class="w-full py-3.5 bg-green-700 hover:bg-green-600 disabled:opacity-50 text-white font-extrabold rounded-xl shadow-lg transition text-xs uppercase tracking-wider">Connexion sécurisée</button>
      <div class="text-center"><button type="button" id="forgot-button" class="text-sm font-semibold text-green-800 hover:underline">Mot de passe oublié ?</button></div>
      <p class="text-[11px] leading-5 text-slate-500 text-center">Votre rôle et vos autorisations sont vérifiés par le serveur et Supabase. Ne partagez jamais votre mot de passe.</p>
    </form>
  </main>
<script>
  const form = document.getElementById("login-form");
  const messageBox = document.getElementById("message");
  const loginButton = document.getElementById("login-button");
  const usernameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");
  function showMessage(text, kind) {
    messageBox.textContent = text;
    messageBox.className = "text-xs font-bold p-3.5 rounded-xl text-center border " +
      (kind === "ok" ? "bg-green-50 text-green-800 border-green-200" : "bg-rose-50 text-rose-700 border-rose-200");
  }
  document.getElementById("toggle-password").addEventListener("click", () => {
    passwordInput.type = passwordInput.type === "password" ? "text" : "password";
    document.getElementById("eye-icon").className = passwordInput.type === "password" ? "fa-solid fa-eye" : "fa-solid fa-eye-slash";
  });
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    messageBox.classList.remove("hidden");
    showMessage("Vérification du compte…", "ok");
    loginButton.disabled = true;
    try {
      const result = await signIn(usernameInput.value, passwordInput.value);
      if (result.success) { window.location.replace("index.html"); return; }
      showMessage(result.message || "Identifiant ou mot de passe incorrect.", "error");
    } catch (_) { showMessage("Service temporairement indisponible. Réessayez plus tard.", "error"); }
    finally { loginButton.disabled = false; }
  });
  document.getElementById("forgot-button").addEventListener("click", async () => {
    const username = usernameInput.value.trim();
    if (!username) { usernameInput.focus(); showMessage("Saisissez d’abord votre nom d’utilisateur.", "error"); return; }
    const button = document.getElementById("forgot-button");
    button.disabled = true;
    messageBox.classList.remove("hidden");
    showMessage("Envoi de la demande…", "ok");
    const result = await requestPasswordReset(username);
    showMessage(result.message, result.success ? "ok" : "error");
    button.disabled = false;
  });
  document.addEventListener("DOMContentLoaded", async () => {
    try { await window.LAS_SUPABASE_READY; }
    catch (_) { messageBox.classList.remove("hidden"); showMessage("Configuration du service indisponible. Contactez l’administrateur LAS.", "error"); }
  });
</script>
</body></html>
