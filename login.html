<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — ASBL LES AMIS DE LA SEMENCE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-green-950">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        <div class="bg-slate-900 p-6 text-center border-b border-green-700/50">
            <div class="w-16 h-16 mx-auto bg-white rounded-2xl flex items-center justify-center shadow-lg mb-4">
                <i class="fa-solid fa-seedling text-3xl text-green-600"></i>
            </div>
            <h1 class="text-xl font-extrabold text-white tracking-tight">ASBL LAS</h1>
            <p class="text-slate-400 text-xs mt-1 font-medium">Plateforme de Gestion Administrative</p>
        </div>

        <form id="login-form" class="p-8 space-y-5" onsubmit="handleLogin(event)">
            <div id="error-msg" class="hidden bg-red-50 text-red-600 text-xs font-bold p-3 rounded-xl text-center border border-red-200">
                Identifiants ou rôle incorrects.
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Rôle</label>
                <select id="role" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-green-500 focus:outline-none">
                    <option value="admin">Administrateur</option>
                    <option value="tresorier">Trésorier(e)</option>
                    <option value="secretaire">Secrétaire</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Identifiant</label>
                <input type="text" id="username" required placeholder="Saisissez votre identifiant" 
                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-green-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Mot de passe</label>
                <div class="relative">
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-green-500 focus:outline-none">
                    <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 mt-2 bg-green-700 hover:bg-green-600 text-white font-bold rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Connexion sécurisée</span>
            </button>
        </form>
    </div>

    <script>
        tailwind.config = { theme: { extend: { colors: { las: { 900: '#14532d' } } } } }

        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text'; icon.className = 'fa-solid fa-eye-slash';
            } else {
                pwd.type = 'password'; icon.className = 'fa-solid fa-eye';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const role = document.getElementById('role').value;
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            
            if (pass.length > 0) {
                sessionStorage.setItem('las_session_role', role);
                sessionStorage.setItem('las_session_user', user);
                localStorage.setItem('las_session_v1', JSON.stringify({ user, role, memberId: 2, label: role.toUpperCase() }));
                window.location.href = 'index.html';
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
