<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — ASBL LES AMIS DE LA SEMENCE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        las: { 50:'#f0fdf4', 100:'#dcfce7', 500:'#22c55e', 600:'#16a34a', 700:'#15803d', 800:'#166534', 900:'#14532d', 950:'#052e16' },
                        gold: { 400:'#facc15', 500:'#eab308' }
                    } 
                } 
            } 
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="Auth.js"></script>
</head>
<body class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-las-950 font-sans">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        <div class="bg-slate-900 p-8 text-center border-b border-las-700/50">
            <div class="w-20 h-20 mx-auto bg-white rounded-2xl flex items-center justify-center shadow-lg mb-4 p-2">
                <img src="logo LAS_2.jpg" alt="Logo officiel ASBL LAS" class="w-full h-full object-contain" onerror="this.onerror=null;this.src='logo LAS.jpg'">
            </div>
            <h1 class="text-xl font-extrabold text-white tracking-tight flex items-center justify-center gap-2">
                ASBL LES AMIS DE LA SEMENCE <span class="text-gold-400 text-xs px-2 py-0.5 rounded-full bg-gold-500/20 border border-gold-500/40">LAS</span>
            </h1>
            <p class="text-slate-400 text-xs mt-1.5 font-medium">Plateforme de Gestion Administrative &amp; Médias</p>
        </div>

        <form id="login-form" class="p-8 space-y-5" onsubmit="handleLogin(event)">
            <div id="error-msg" class="hidden bg-rose-50 text-rose-600 text-xs font-bold p-3.5 rounded-xl text-center border border-rose-200">
                Identifiants ou mot de passe incorrects.
            </div>

            <div><p class="text-xs text-slate-500">Votre rôle est chargé depuis votre compte autorisé. Il ne peut pas être choisi ou modifié depuis cette page.</p></div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Identifiant</label>
                <input type="email" id="username" autocomplete="username" required placeholder="Adresse e-mail du compte autorisé" 
                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-las-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Mot de passe</label>
                <div class="relative">
                    <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••" 
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-las-500 focus:outline-none">
                    <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <div class="text-right -mt-2">
                <a href="forgot-password.html" class="text-xs font-bold text-las-700 hover:text-las-900 underline underline-offset-4">Mot de passe oublié ?</a>
            </div>

            <button type="submit" class="w-full py-3.5 mt-2 bg-las-700 hover:bg-las-600 text-white font-extrabold rounded-xl shadow-lg shadow-las-900/30 transition active:scale-95 flex items-center justify-center gap-2 text-xs uppercase tracking-wider">
                <i class="fa-solid fa-right-to-bracket text-gold-400"></i>
                <span>Connexion sécurisée</span>
            </button>
        </form>
    </div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                pwd.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const form = document.getElementById('login-form');
            const button = form.querySelector('button[type="submit"]');
            const errorBox = document.getElementById('error-msg');
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            errorBox.classList.remove('hidden');
            errorBox.textContent = "Vérification du compte…";
            errorBox.className = "bg-blue-50 text-blue-700 text-xs font-bold p-3.5 rounded-xl text-center border border-blue-200";
            button.disabled = true;
            try {
                const result = await signIn(user, pass);
                if (result.success) { window.location.replace('index.html'); return; }
                errorBox.textContent = result.message || "Connexion refusée.";
                errorBox.className = "bg-rose-50 text-rose-600 text-xs font-bold p-3.5 rounded-xl text-center border border-rose-200";
            } catch (_) {
                errorBox.textContent = "Service temporairement indisponible. Réessayez plus tard.";
                errorBox.className = "bg-rose-50 text-rose-600 text-xs font-bold p-3.5 rounded-xl text-center border border-rose-200";
            } finally { button.disabled = false; }
        }
        document.addEventListener("DOMContentLoaded", async () => {
            try { await window.LAS_SUPABASE_READY; } catch (_) {}
            if (!lasIsConfigured()) {
                const box = document.getElementById("error-msg");
                box.textContent = "Configuration requise : renseignez l’URL et la clé publique Supabase dans supabase-config.js, puis appliquez supabase/schema.sql. Aucun accès de secours n’est activé.";
                box.classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
