<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Connexion — ASBL LES AMIS DE LA SEMENCE (LAS)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans:['Plus Jakarta Sans','sans-serif'], mono:['JetBrains Mono','monospace'] },
  colors: { las:{50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d',950:'#052e16'},
            gold:{400:'#facc15',500:'#eab308',600:'#ca8a04',700:'#a16207'} } } } }
</script>
<style>
  html,body{min-height:100%}
  body{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
  .grain{background-image:radial-gradient(circle at 20% 20%,rgba(34,197,94,.12),transparent 40%),radial-gradient(circle at 80% 70%,rgba(234,179,8,.10),transparent 45%)}
</style>
</head>
<body class="font-sans bg-slate-950 text-slate-100 grain min-h-full flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo + titre -->
    <div class="text-center mb-6">
      <div class="mx-auto w-20 h-20 rounded-2xl bg-white p-1.5 shadow-xl ring-2 ring-las-500/30 flex items-center justify-center overflow-hidden">
        <img src="logo LAS_2.jpg" alt="Logo LAS" class="w-full h-full object-contain"
             onerror="this.onerror=null;this.src='logo LAS.jpg';this.onerror=function(){this.replaceWith(document.getElementById('svg-logo').cloneNode(true));}">
        <svg id="svg-logo" viewBox="0 0 200 200" class="hidden w-full h-full">
          <path d="M 40,150 Q 100,185 160,150 Q 100,165 40,150" fill="#16a34a"/>
          <ellipse cx="100" cy="125" rx="25" ry="10" fill="#78350f"/>
          <path d="M 100,125 Q 98,105 100,95 Q 102,105 100,125" fill="#22c55e"/>
          <path d="M 100,100 Q 88,90 92,80 Q 100,88 100,100" fill="#facc15"/>
          <path d="M 100,100 Q 112,90 108,80 Q 100,88 100,100" fill="#22c55e"/>
          <circle cx="100" cy="92" r="42" fill="none" stroke="#16a34a" stroke-dasharray="3,3" opacity="0.5"/>
          <circle cx="100" cy="52" r="5" fill="#15803d"/><circle cx="132" cy="62" r="5" fill="#0284c7"/>
          <circle cx="145" cy="90" r="5" fill="#ca8a04"/><circle cx="130" cy="120" r="5" fill="#0d9488"/>
          <circle cx="70" cy="120" r="5" fill="#b91c1c"/><circle cx="55" cy="90" r="5" fill="#ea580c"/>
          <circle cx="68" cy="62" r="5" fill="#16a34a"/>
        </svg>
      </div>
      <h1 class="mt-4 text-xl font-extrabold tracking-tight">ASBL LES AMIS DE LA SEMENCE
        <span class="text-gold-400 text-xs px-2 py-0.5 rounded-full bg-gold-500/20 border border-gold-500/40 align-middle">LAS</span>
      </h1>
      <p class="text-xs text-slate-400 mt-1">Espace sécurisé — Administration des membres</p>
    </div>

    <!-- Carte login -->
    <div class="bg-slate-900/80 backdrop-blur rounded-2xl border border-slate-800 shadow-2xl p-6 sm:p-7">
      <h2 class="text-base font-bold mb-1 flex items-center gap-2"><i class="fa-solid fa-lock text-las-500"></i> Connexion</h2>
      <p class="text-[11px] text-slate-500 mb-5">Entrez vos identifiants pour accéder au répertoire.</p>

      <form id="login-form" autocomplete="off" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Identifiant</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input id="username" type="text" required autocapitalize="none" spellcheck="false"
                   class="w-full pl-10 pr-3 py-3 bg-slate-800/70 border border-slate-700 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-las-500 focus:bg-slate-800 transition"
                   placeholder="Votre identifiant">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Mot de passe</label>
          <div class="relative">
            <i class="fa-solid fa-key absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input id="password" type="password" required
                   class="w-full pl-10 pr-11 py-3 bg-slate-800/70 border border-slate-700 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-las-500 focus:bg-slate-800 transition"
                   placeholder="••••••••">
            <button type="button" id="toggle-pw" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition" aria-label="Afficher le mot de passe">
              <i class="fa-solid fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <label class="flex items-center gap-2 text-xs text-slate-400 select-none cursor-pointer">
          <input id="remember" type="checkbox" class="rounded border-slate-600 bg-slate-800 text-las-600 focus:ring-las-500">
          Rester connecté sur cet appareil
        </label>

        <div id="error-box" class="hidden text-xs font-semibold text-rose-300 bg-rose-900/40 border border-rose-800 rounded-xl px-3.5 py-2.5 flex items-center gap-2">
          <i class="fa-solid fa-triangle-exclamation"></i><span id="error-text"></span>
        </div>

        <button type="submit" id="submit-btn"
          class="w-full py-3 bg-gradient-to-r from-emerald-600 to-las-600 hover:from-emerald-500 hover:to-las-500 text-white font-extrabold rounded-xl text-sm transition shadow-lg shadow-emerald-900/40 active:scale-[.99] flex items-center justify-center gap-2 ring-2 ring-emerald-400/10">
          <i class="fa-solid fa-right-to-bracket"></i> Se connecter
        </button>
      </form>
    </div>

    <p class="text-center text-[10px] text-slate-600 mt-5 leading-relaxed">
      ASBL LES AMIS DE LA SEMENCE (LAS) &copy; <span id="year"></span><br>
      Accès réservé au secrétariat et à la direction.
    </p>
  </div>

<script>
// ============================================================
//  AUTHENTIFICATION CÔTÉ CLIENT
//  Les mots de passe ne sont JAMAIS stockés en clair : seul le
//  hachage SHA-256 figure ici. Voir le README pour changer un
//  mot de passe. (Sécurité de confort : une app sans serveur ne
//  peut pas garantir une protection forte.)
// ============================================================
const USERS = [
  { user: "mastor",     role: "admin",      label: "Administrateur",
    hash: "ff0d8ecab6995bf00f675811aa44a202a75d6ef65d930cd706f344a55b8657ee" },
  { user: "tresorier",  role: "tresorier",  label: "Trésorier(ère)",
    hash: "211cb28891f87469a917d9f9d1dc4fd2f6f3de5751d5f63052d2145b78ef4e7d" },
  { user: "secretaire", role: "secretaire", label: "Secrétaire",
    hash: "bcc68f7fff090245f7044bfc08b8189fd8d7f03907288e2ccc171dec6c6cb69c" },
];
const SESSION_KEY = "las_session_v1";

document.getElementById('year').textContent = new Date().getFullYear();

// Si déjà connecté, rediriger directement
(function(){
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY) || "null");
    if (s && s.user) window.location.replace("index.html");
  } catch(e){}
})();

async function sha256(txt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

// Afficher / masquer le mot de passe
document.getElementById('toggle-pw').addEventListener('click', function(){
  const pw = document.getElementById('password');
  const ic = this.querySelector('i');
  if (pw.type === 'password'){ pw.type='text'; ic.className='fa-solid fa-eye-slash text-sm'; }
  else { pw.type='password'; ic.className='fa-solid fa-eye text-sm'; }
});

function showError(msg){
  const box=document.getElementById('error-box');
  document.getElementById('error-text').textContent=msg;
  box.classList.remove('hidden');
}

// Anti-force brute léger : petit délai croissant après échecs
let attempts = 0;

document.getElementById('login-form').addEventListener('submit', async function(e){
  e.preventDefault();
  document.getElementById('error-box').classList.add('hidden');
  const u = document.getElementById('username').value.trim().toLowerCase();
  const p = document.getElementById('password').value;
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Vérification...';

  if (attempts > 0) await new Promise(r=>setTimeout(r, Math.min(attempts*600, 3000)));

  const h = await sha256(p);
  const match = USERS.find(x => x.user === u && x.hash === h);

  if (match){
    const session = { user: match.user, role: match.role, label: match.label, ts: Date.now() };
    const store = document.getElementById('remember').checked ? localStorage : sessionStorage;
    store.setItem(SESSION_KEY, JSON.stringify(session));
    // nettoyer l'autre espace de stockage
    (store === localStorage ? sessionStorage : localStorage).removeItem(SESSION_KEY);
    btn.innerHTML = '<i class="fa-solid fa-check"></i> Bienvenue';
    window.location.replace("index.html");
  } else {
    attempts++;
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Se connecter';
    showError("Identifiant ou mot de passe incorrect.");
    document.getElementById('password').value = "";
    document.getElementById('password').focus();
  }
});
</script>
</body>
</html>
